<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3BHK Closed Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#E9ECE6; --scene:#E2E6DF; --panel:rgba(250,251,248,.92);
  --ink:#1D2421; --muted:#5C6661; --line:#C9CFC6;
  --accent:#A4532F; --accent-soft:rgba(164,83,47,.12);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --scene:#171C1A; --panel:rgba(27,32,30,.92);
    --ink:#E4E8E2; --muted:#9AA49E; --line:#343C38;
    --accent:#DE8F63; --accent-soft:rgba(222,143,99,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --scene:#171C1A; --panel:rgba(27,32,30,.92);
  --ink:#E4E8E2; --muted:#9AA49E; --line:#343C38;
  --accent:#DE8F63; --accent-soft:rgba(222,143,99,.16);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.app{position:fixed;inset:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

.bar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.bar > *{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tog{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tog::before{content:"";width:9px;height:9px;border-radius:2px;border:1.5px solid currentColor}
.tog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--panel)}
.tog[aria-pressed="true"]::before{background:currentColor}

.rooms{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:left}
.chip .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);font-weight:400}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-current="true"] .d{color:var(--accent)}

.hint{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:min(380px,calc(100% - 32px));font-size:12px;line-height:1.4;color:var(--muted);margin:0;background:var(--panel);padding:6px 10px;border-radius:7px;border:1px solid var(--line)}
.pad{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 116px);display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:6px}
.pad button{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;place-items:center}
.pad button:active{background:var(--accent-soft);border-color:var(--accent)}
.pad [data-act="fwd"]{grid-column:2;grid-row:1}
.pad [data-act="left"]{grid-column:1;grid-row:2}
.pad [data-act="back"]{grid-column:2;grid-row:2}
.pad [data-act="right"]{grid-column:3;grid-row:2}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:0 16px;text-align:center;color:var(--muted)}
</style>

<div class="app">
  <canvas id="c" tabindex="0" aria-label="3D model of the flat"></canvas>

  <header class="bar">
    <div class="brand">
      <h1>3BHK Flat · Closed kitchen</h1>
      <p class="sub mono" id="area">Sizes in cm, from the plan</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button id="m-overview" aria-pressed="true">3D view</button>
        <button id="m-top" aria-pressed="false">Top</button>
        <button id="m-walk" aria-pressed="false">Walk</button>
      </div>
      <button class="tog" id="t-labels" aria-pressed="true">Labels</button>
      <button class="tog" id="t-half" aria-pressed="false">Low walls</button>
    </div>
  </header>

  <div class="pad" id="pad" hidden>
    <button data-act="fwd" aria-label="Walk forward">▲</button>
    <button data-act="left" aria-label="Turn left">↺</button>
    <button data-act="back" aria-label="Walk back">▼</button>
    <button data-act="right" aria-label="Turn right">↻</button>
  </div>

  <p class="hint" id="hint"></p>
  <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE || !THREE.OrbitControls){
  document.querySelector('.app').insertAdjacentHTML('beforeend','<p class="err">The 3D engine did not load. Please check your connection and reload.</p>');
  return;
}
const $ = s => document.querySelector(s);

/* ---------- Plan data (all in cm, taken from the floor plan) ----------
   x = left→right on the plan, y = top→bottom on the plan. Origin = top-left corner of Master bed. */
const ROOMS = [
  {id:'foyer',  name:'Foyer',         dims:'140 × 140', r:[-140,860,0,1000],  f:'tile', chip:true},
  {id:'living', name:'Living',        dims:'360 × 460', r:[0,700,360,1160],   f:'tile', chip:true},
  {id:'dining', name:'Dining',        dims:'510 × 300', r:[0,400,510,700],    f:'tile', chip:true},
  {id:'kitchen',name:'Kitchen',       dims:'330 × 300', r:[360,700,690,1000], f:'tile', chip:true},
  {id:'mbed',   name:'Master bed',    dims:'360 × 400', r:[0,0,360,400],      f:'wood', chip:true},
  {id:'bed2',   name:'Bed 2',         dims:'390 × 320', r:[-390,540,0,860],   f:'wood', chip:true},
  {id:'bed3',   name:'Bed 3',         dims:'330 × 390', r:[360,0,690,400],    f:'wood', chip:true},
  {id:'bald',   name:'Balcony',       dims:'200 × 300', r:[510,400,710,700],  f:'deck', chip:true, chipName:'Dining balcony'},
  {id:'t1',     name:'Toilet',        dims:'160 × 240', r:[200,-240,360,0],   f:'wet', small:true},
  {id:'t2',     name:'Toilet',        dims:'160 × 240', r:[360,-240,520,0],   f:'wet', small:true},
  {id:'t3',     name:'Toilet',        dims:'160 × 240', r:[-550,600,-390,840],f:'wet', small:true},
  {id:'balmb',  name:'Balcony',       dims:'200 × 120', r:[0,-120,200,0],     f:'deck',small:true},
  {id:'bal3',   name:'Balcony',       dims:'120 × 220', r:[690,40,810,260],   f:'deck',small:true},
  {id:'wa',     name:'Work area',     dims:'165 × 130', r:[360,1000,525,1130],f:'wet', small:true},
  {id:'dry',    name:'Dry balcony',   dims:'175 × 120', r:[525,1000,700,1120],f:'deck',small:true}
];

// Walls: [x1,y1,x2,y2, openings, kind]. Opening = [from, to, type, {hinge:'s'|'e', side:±1, ang, main}]
// type: door | open | wide | slide | win | vent.  side = which side of the wall the door swings into.  kind 'p' = balcony railing, 'j' = parapet with jalli screen above
const WALLS = [
  [200,-240,520,-240,[[240,320,'vent'],[400,480,'vent']]],
  [200,-240,200,0],
  [360,-240,360,400],
  [520,-240,520,0],
  [0,0,690,0,[[25,175,'slide'],[270,345,'door',{hinge:'e',side:-1}],[375,450,'door',{hinge:'s',side:-1}],[560,660,'win']]],
  [0,0,0,540,[[120,300,'win']]],
  [690,0,690,400,[[70,230,'slide']]],
  [0,400,710,400,[[250,340,'door',{hinge:'s',side:-1}],[380,470,'door',{hinge:'e',side:-1,ang:66}]]],
  [510,400,510,700,[[420,680,'slide']]],
  [360,700,710,700],
  [360,700,360,1000,[[712,875,'wide']]],
  [690,700,690,1000,[[840,950,'win']]],
  [525,1000,700,1000],
  [360,1000,360,1160],
  [360,1130,525,1130],
  [525,1000,525,1130,[[1025,1095,'door',{hinge:'e',side:1}]]],   // dry balcony door from the work area, opposite the jalli
  [0,1160,360,1160],
  [0,1000,0,1160],
  [-140,1000,0,1000],
  [-140,860,-140,1000,[[885,975,'door',{hinge:'s',side:1,main:true,ang:78}]]],
  [-390,860,0,860],
  [-390,540,0,540,[[-304,-80,'win']]],
  [0,540,0,860,[[770,850,'door',{hinge:'e',side:-1}]]],   // Bed 2 door, hinged at the corner so it folds back against the wall
  [-390,540,-390,860,[[770,840,'door',{hinge:'e',side:-1}]]],
  [-550,600,-390,600,[[-460,-400,'vent']]],
  [-550,840,-390,840],
  [-550,600,-550,840],
  [0,-120,200,-120,[],'p'], [0,-120,0,0,[],'p'],
  [690,40,810,40,[],'p'], [810,40,810,260,[],'p'], [690,260,810,260,[],'p'],
  [710,400,710,700,[],'p'],
  [525,1120,700,1120], [700,1000,700,1120,[],'j']
];

// Area line
const parse = d => d.split('×').map(s=>parseFloat(s)/100);
const area = ROOMS.reduce((s,r)=>{const [a,b]=parse(r.dims); return s+a*b;},0);
$('#area').textContent = `Sizes in cm · rooms add up to ${area.toFixed(1)} m² (${Math.round(area*10.7639)} sq ft)`;

/* ---------- Three.js setup ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // scene is static: redraw shadows only when needed
renderer.shadowMap.needsUpdate = true;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 1.5;
controls.maxDistance = 45;

const CENTER = new THREE.Vector3(1.3, 0, 4.6);
const root = new THREE.Group();
root.scale.setScalar(0.01);           // model in cm, world in m
scene.add(root);

function applyBg(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#E2E6DF';
  scene.background = new THREE.Color(v);
}
applyBg();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg); }catch(e){}
new MutationObserver(applyBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// Soft sky environment for ambient light and reflections
(function(){
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  const sg = new THREE.SphereGeometry(10,32,16);
  const p = sg.attributes.position, cols = [];
  const zen = [1.0,1.0,1.03], hor = [0.9,0.86,0.8], gnd = [0.36,0.33,0.3];
  for(let i=0;i<p.count;i++){
    const y = p.getY(i)/10, a = y>0?zen:gnd, k = Math.abs(y);
    cols.push(hor[0]+(a[0]-hor[0])*k, hor[1]+(a[1]-hor[1])*k, hor[2]+(a[2]-hor[2])*k);
  }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide})));
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(9,4), new THREE.MeshBasicMaterial({color:new THREE.Color(2.6,2.5,2.3), side:THREE.DoubleSide}));
  panel.position.set(-3,6,-5); panel.lookAt(0,0,0); es.add(panel);
  scene.environment = pm.fromScene(es, 0.04).texture;
})();

// Sun
const sun = new THREE.DirectionalLight(0xfff0dc, 1.7);
sun.position.set(CENTER.x-5, 14, CENTER.z-6);
sun.target.position.copy(CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
// Warm room lights (no shadows)
[[1.9,2.2,5.65,.55],[1.8,2.6,9.8,.45],[1.8,2.6,2.0,.4],[5.2,2.6,2.0,.4],[-1.9,2.6,7.0,.4],[5.2,2.6,8.5,.4],[-0.7,2.5,9.3,.3]]
  .forEach(([x,y,z,i])=>{ const l = new THREE.PointLight(0xffd9a8, i, 5, 2); l.position.set(x,y,z); scene.add(l); });

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.ShadowMaterial({opacity:0.14}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.035; ground.receiveShadow = true;
scene.add(ground);

// Section cut for "Low walls"
const clip = new THREE.Plane(new THREE.Vector3(0,-1,0), 100);
const toLin = c => new THREE.Color(c).convertSRGBToLinear();
function M(color, extra){
  const o = Object.assign({roughness:.85, metalness:0, clippingPlanes:[clip], clipShadows:true}, extra||{});
  o.color = toLin(color);
  if(o.emissive) o.emissive = toLin(o.emissive);
  return new THREE.MeshStandardMaterial(o);
}

/* ---------- Textures ---------- */
let seed = 11; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
function shade(hex, v){
  const n = parseInt(hex.slice(1),16), c = x => Math.max(0,Math.min(255,Math.round(x+v)));
  return `rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`;
}
function canvasTex(draw, px){
  const c = document.createElement('canvas'); c.width = c.height = px;
  draw(c.getContext('2d'), px);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const tileTex = (base,grout,vein) => canvasTex((g,p)=>{
  const n=2, s=p/n;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    g.fillStyle = shade(base,(rnd()-.5)*8); g.fillRect(i*s,j*s,s,s);
    g.strokeStyle = vein; g.globalAlpha = .09; g.lineWidth = 1.2;
    for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(i*s+rnd()*s,j*s); g.bezierCurveTo(i*s+rnd()*s,j*s+rnd()*s,i*s+rnd()*s,j*s+rnd()*s,i*s+rnd()*s,j*s+s); g.stroke(); }
    g.globalAlpha = 1;
  }
  g.strokeStyle = grout; g.lineWidth = 2;
  for(let i=0;i<=n;i++){ g.beginPath(); g.moveTo(i*s,0); g.lineTo(i*s,p); g.stroke(); g.beginPath(); g.moveTo(0,i*s); g.lineTo(p,i*s); g.stroke(); }
},256);
const woodTex = (tones,gap) => canvasTex((g,p)=>{
  const rows=8, h=p/rows;
  for(let r=0;r<rows;r++){
    let x = -rnd()*p*0.6;
    while(x<p){
      const len = p*(0.45+rnd()*0.5);
      g.fillStyle = shade(tones[Math.floor(rnd()*tones.length)], (rnd()-.5)*12); g.fillRect(x,r*h,len,h);
      g.globalAlpha = .1; g.strokeStyle = '#3a2414'; g.lineWidth = 1;
      for(let k=0;k<7;k++){ const yy=r*h+3+rnd()*(h-6); g.beginPath(); g.moveTo(x,yy); for(let xx=x; xx<x+len; xx+=14) g.lineTo(xx, yy+Math.sin(xx*0.03+k)*1.4); g.stroke(); }
      g.globalAlpha = 1; g.fillStyle = gap; g.fillRect(x,r*h,1.5,h); x += len;
    }
    g.fillStyle = gap; g.fillRect(0,r*h+h-2,p,2);
  }
},512);
const quartzTex = canvasTex((g,p)=>{
  g.fillStyle='#EEEBE6'; g.fillRect(0,0,p,p);
  g.strokeStyle='#9E978C'; g.lineWidth=1.4;
  for(let k=0;k<6;k++){ g.globalAlpha=.08+rnd()*.12; g.beginPath(); g.moveTo(rnd()*p,0); g.bezierCurveTo(rnd()*p,rnd()*p,rnd()*p,rnd()*p,rnd()*p,p); g.stroke(); }
  g.globalAlpha=1;
},256);

// Jalli: white = solid web, black = cut-out. Used as an alpha map.
const jalliTex = canvasTex((g,p)=>{
  g.fillStyle='#fff'; g.fillRect(0,0,p,p); g.fillStyle='#000';
  const circ=(x,y,r)=>{ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); };
  const quat=(x,y,o,r)=>{ circ(x-o,y,r); circ(x+o,y,r); circ(x,y-o,r); circ(x,y+o,r); circ(x,y,o); };
  quat(p/2,p/2,p*.16,p*.18);
  [[0,0],[p,0],[0,p],[p,p]].forEach(([x,y])=>circ(x,y,p*.2));
},256);
jalliTex.encoding = THREE.LinearEncoding;

const FLOOR = {
  tile: {t:tileTex('#EAE5DC','#D1C9BC','#9E968A'), s:120, r:.32},
  wet:  {t:tileTex('#B7BBBB','#9DA2A2','#6E7373'), s:60,  r:.6},
  wood: {t:woodTex(['#C39565','#B8895A','#CB9F70','#B28152'],'#7E5634'), s:160, r:.6},
  deck: {t:woodTex(['#8E6340','#845A38','#97694A'],'#3F2717'), s:120, r:.85}
};

const MAT = {
  wall:  M('#F2EFEA',{roughness:.95, side:THREE.DoubleSide}),
  skirt: M('#D8D1C6',{roughness:.6}),
  curb:  M('#E4E0D8'),
  glass: M('#D4E6EC',{transparent:true,opacity:.2,roughness:.05,metalness:.1,side:THREE.DoubleSide,depthWrite:false}),
  frosted: M('#F4F6F6',{transparent:true,opacity:.72,roughness:.6,side:THREE.DoubleSide}),
  alu:   M('#3A3733',{roughness:.45,metalness:.5}),
  sill:  M('#3E3A36',{roughness:.3}),
  threshold: M('#4A4541',{roughness:.3}),
  teak:  M('#6B4226',{roughness:.55}),
  doorOak: M('#C9A27A',{roughness:.6}),
  oak:   M('#CDAA82',{roughness:.6}),
  walnut:M('#6A4630',{roughness:.55}),
  walnutDark: M('#3B281B',{roughness:.6}),
  whiteLacq: M('#F4F1EC',{roughness:.35}),
  sage:  M('#8CA28B',{roughness:.5}),
  quartz:M('#FFFFFF',{map:quartzTex,roughness:.22}),
  linen: M('#F3EFE7',{roughness:1}),
  pillow:M('#FAF8F4',{roughness:1}),
  sofa:  M('#D3CABA',{roughness:1}),
  sofaDark: M('#BDB3A2',{roughness:1}),
  chairFab: M('#8E9A8C',{roughness:1}),
  teal:  M('#3F7F7A',{roughness:1}),
  terracotta: M('#B8643E',{roughness:1}),
  mustard: M('#C99A3B',{roughness:1}),
  ceramic: M('#FBFBFA',{roughness:.18}),
  black: M('#232323',{roughness:.5}),
  gap:   M('#2B2622',{roughness:.8}),
  steel: M('#C4C8CA',{roughness:.28,metalness:.8}),
  steelDark: M('#8D9296',{roughness:.3,metalness:.8}),
  chrome:M('#E2E5E8',{roughness:.12,metalness:1}),
  brass: M('#B08D57',{roughness:.3,metalness:.8}),

/* ---------- Geometry helpers (all in cm) ---------- */
let curParent = null;
const add = m => { (curParent||root).add(m); return m; };
function box(x0,x1,z0,z1,h0,h1,mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0), h1-h0, Math.abs(z1-z0)), mat);
  m.position.set((x0+x1)/2,(h0+h1)/2,(z0+z1)/2);
  m.castShadow = !mat.transparent; m.receiveShadow = true;
  return add(m);
}
function rrShape(w,d,cr){
  const s = new THREE.Shape(), x=-w/2, y=-d/2; cr = Math.max(0.01, Math.min(cr, w/2, d/2));
  s.moveTo(x+cr,y); s.lineTo(x+w-cr,y); s.quadraticCurveTo(x+w,y,x+w,y+cr);
  s.lineTo(x+w,y+d-cr); s.quadraticCurveTo(x+w,y+d,x+w-cr,y+d);
  s.lineTo(x+cr,y+d); s.quadraticCurveTo(x,y+d,x,y+d-cr);
  s.lineTo(x,y+cr); s.quadraticCurveTo(x,y,x+cr,y);
  return s;
}
const geoCache = new Map();
function rbox(x0,x1,z0,z1,h0,h1,mat,r){
  const w=Math.abs(x1-x0), d=Math.abs(z1-z0), h=h1-h0;
  r = Math.max(0.2, Math.min(r||3, w/2-0.2, d/2-0.2, h/2-0.2));
  const key = [w,d,h,r].map(v=>v.toFixed(1)).join('|');
  let g = geoCache.get(key);
  if(!g){
    const sw = Math.max(w-2*r,0.2), sd = Math.max(d-2*r,0.2);
    g = new THREE.ExtrudeGeometry(rrShape(sw,sd,Math.min(r*0.6,sw/2,sd/2)),
      {depth:Math.max(h-2*r,0.1), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4});
    g.rotateX(-Math.PI/2); g.translate(0,r,0);
    geoCache.set(key,g);
  }
  const m = new THREE.Mesh(g,mat);
  m.position.set((x0+x1)/2,h0,(z0+z1)/2);
  m.castShadow = !mat.transparent; m.receiveShadow = true;
  return add(m);
}
function cyl(x,z,h0,h1,rt,rb,mat,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h1-h0,seg||24), mat);
  m.position.set(x,(h0+h1)/2,z); m.castShadow = !mat.transparent; m.receiveShadow = true;
  return add(m);
}
function sph(x,y,z,r,mat,sx,sy,sz){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,16,12), mat);
  m.position.set(x,y,z); m.scale.set(sx||1,sy||1,sz||1); m.castShadow = true; m.receiveShadow = true;
  return add(m);
}
function grp(x,z,rot,fn){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = rot; add(g);
  const prev = curParent; curParent = g; fn(); curParent = prev; return g;
}
// Box against a front face of rect r: s..e along the face, d0..d1 outward from it
function FB(r,front,s,e,d0,d1,h0,h1,mat){
  const [x0,x1,z0,z1] = r;
  if(front==='z-') return box(s,e,z0-d1,z0-d0,h0,h1,mat);
  if(front==='z+') return box(s,e,z1+d0,z1+d1,h0,h1,mat);
  if(front==='x-') return box(x0-d1,x0-d0,s,e,h0,h1,mat);
  return box(x1+d0,x1+d1,s,e,h0,h1,mat);
}

const T = 15, WH = 290;
function jalli(horiz,c,s,e,h0,h1,col){
  const w = e-s, h = h1-h0, t = jalliTex.clone(); t.needsUpdate = true; t.repeat.set(w/20, h/20);
  const mat = M(col||'#B5673F',{alphaMap:t, alphaTest:.5, side:THREE.DoubleSide, roughness:.9});
  const dm = new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking, alphaMap:t, alphaTest:.5, side:THREE.DoubleSide, clippingPlanes:[clip]});
  const g = new THREE.PlaneGeometry(w,h);
  [-3.5,-2.3,-1.2,0,1.2,2.3,3.5].forEach(off=>{   // stacked layers give the screen its thickness
    const m = new THREE.Mesh(g,mat); m.customDepthMaterial = dm; m.castShadow = true; m.receiveShadow = true;
    if(horiz) m.position.set((s+e)/2,(h0+h1)/2,c+off);

WALLS.forEach(([x1,y1,x2,y2,ops,kind])=>{
  ops = ops||[];
  const horiz = y1===y2, c = horiz?y1:x1, par = kind==='p', th = par?10:T;
  const a = Math.min(horiz?x1:y1, horiz?x2:y2) - th/2;
  const b = Math.max(horiz?x1:y1, horiz?x2:y2) + th/2;
  const B = (s,e,p0,p1,h0,h1,mat) => {
    if(e-s<=0.3 || h1-h0<=0.3) return null;
    return horiz ? box(s,e,c+p0,c+p1,h0,h1,mat) : box(c+p0,c+p1,s,e,h0,h1,mat);
  };
  if(par){   // glass balcony railing
    B(a,b,-5,5,-3,12,MAT.curb);
    B(a+2,b-2,-0.6,0.6,12,100,MAT.glass);
    B(a,b,-2.5,2.5,100,104,MAT.alu);
    const n = Math.max(1,Math.round((b-a)/100));
    for(let i=0;i<=n;i++){ const p=a+2+(b-a-4)*i/n; B(p-1.5,p+1.5,-1.5,1.5,12,100,MAT.alu); }
    return;
  }
  const solid = (s,e,h0,h1) => {
    B(s,e,-T/2,T/2,h0<=0?-3:h0,h1,MAT.wall);
    if(h0<=0){ B(s,e,T/2,T/2+1.2,0,9,MAT.skirt); B(s,e,-T/2-1.2,-T/2,0,9,MAT.skirt); }
  };
  const frame = (s,e,fm) => {
    B(s,s+4,-T/2-1,T/2+1,0,212,fm); B(e-4,e,-T/2-1,T/2+1,0,212,fm); B(s,e,-T/2-1,T/2+1,208,212,fm);
    [1,-1].forEach(f=>{
      const p0 = f>0 ? T/2+1 : -T/2-2.5, p1 = f>0 ? T/2+2.5 : -T/2-1;
      B(s-6,s+1,p0,p1,0,219,fm); B(e-1,e+6,p0,p1,0,219,fm); B(s-6,e+6,p0,p1,212,219,fm);
    });
    B(s,e,-T/2,T/2,-3,0.4,MAT.threshold);
  };
  const leaf = (s,e,o) => {
    const w = e-s-9, side = o.side||1, ang = (o.ang||72)*Math.PI/180;
    const hc = o.hinge==='e' ? e-4.5 : s+4.5, d0 = o.hinge==='e' ? -1 : 1;
    const dA = d0*Math.cos(ang), dP = side*Math.sin(ang), hp = side*(T/2-2.5);
    const hx = horiz ? hc : c+hp, hz = horiz ? c+hp : hc;
    const dx = horiz ? dA : dP, dz = horiz ? dP : dA;
    grp(hx,hz,Math.atan2(-dz,dx),()=>{
      box(0,w,-2,2,1,207,o.main?MAT.teak:MAT.doorOak);
      if(o.main){
        [40,80,120,160].forEach(h=>box(5,w-5,-2.25,2.25,h,h+0.8,MAT.walnutDark));
        [-1,1].forEach(f=>{ box(w-13,w-10,f*6,f*8,70,150,MAT.brass); box(w-13,w-10,f*2,f*6,74,77,MAT.brass); box(w-13,w-10,f*2,f*6,143,146,MAT.brass); });
      } else {

        [-1,1].forEach(f=>box(w-20,w-6,f*3,f*5,100,102.5,MAT.chrome));
      }
    });
  };
  const slider = (s,e) => {
    const m = MAT.alu;
    B(s,s+4,-5,5,0,222,m); B(e-4,e,-5,5,0,222,m); B(s,e,-5,5,218,222,m); B(s,e,-5,5,0,2,m);
    const pw = (e-s-8)/2+3;
    [[s+4,s+4+pw,-2.5],[e-4-pw,e-4,2.5]].forEach(([p,q,o])=>{
      B(p,p+5,o-1.5,o+1.5,2,218,m); B(q-5,q,o-1.5,o+1.5,2,218,m);
      B(p,q,o-1.5,o+1.5,2,9,m); B(p,q,o-1.5,o+1.5,211,218,m);
      B(p+5,q-5,o-0.5,o+0.5,9,211,MAT.glass);
    });
    B(s,e,-T/2,T/2,-3,0.4,MAT.threshold);
  };
  const win = (s,e,h0,h1,frost) => {
    const m = MAT.alu;
    B(s,s+4,-4,4,h0,h1,m); B(e-4,e,-4,4,h0,h1,m); B(s,e,-4,4,h0,h0+4,m); B(s,e,-4,4,h1-4,h1,m);

  };

    [1,-1].forEach(f=>{

    const s0 = a+T, e0 = b-T, J0 = 92, J1 = 272;

    return;
  }
  let cur = a;
  ops.slice().sort((p,q)=>p[0]-q[0]).forEach(([s,e,t,o])=>{
    o = o||{};
    solid(cur,s,0,WH);
    if(t==='door'){ solid(s,e,212,WH); frame(s,e,o.main?MAT.teak:MAT.doorOak); leaf(s,e,o); }

    if(t==='wide'){ solid(s,e,240,WH); wide(s,e,240); }
    if(t==='slide'){ solid(s,e,222,WH); slider(s,e); }
    if(t==='win'){ solid(s,e,0,90); solid(s,e,212,WH); win(s,e,90,212,false); }
    if(t==='vent'){ solid(s,e,0,170); solid(s,e,212,WH); win(s,e,170,212,true); }

});

const labels = [];
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function makeLabel(rm){
  const c = document.createElement('canvas'); c.width=512; c.height=170;
  const g = c.getContext('2d');
  const nf = '600 50px "Instrument Sans", system-ui, sans-serif', df = '500 36px "IBM Plex Mono", ui-monospace, monospace';
  g.font = nf; const nw = g.measureText(rm.name).width;
  g.font = df; const dtxt = rm.dims+' cm'; const dw = g.measureText(dtxt).width;
  const w = Math.min(500, Math.max(nw,dw)+60);
  g.fillStyle='rgba(255,255,255,.93)'; rrect(g,(512-w)/2,8,w,154,22); g.fill();
  g.strokeStyle='rgba(29,36,33,.18)'; g.lineWidth=2; g.stroke();
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#1D2421'; g.font=nf; g.fillText(rm.name,256,62);
  g.fillStyle='#A4532F'; g.font=df; g.fillText(dtxt,256,118);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,toneMapped:false}));
  const k = rm.small ? 150 : 215;
  s.scale.set(k, k*170/512, 1);
  const [x0,z0,x1,z1] = rm.r;
  s.position.set((x0+x1)/2, 325, (z0+z1)/2);
  s.renderOrder = 10;
  root.add(s); labels.push(s);
}

  chipsEl.appendChild(b);
});
function markChip(id){ chipsEl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-current', c.id==='chip-'+id ? 'true':'false')); }

function syncLabels(){ labels.forEach(s=>s.visible = state.labels && state.mode!=='walk'); }

$('#t-labels').addEventListener('click',e=>{ state.labels=!state.labels; e.currentTarget.setAttribute('aria-pressed',state.labels); syncLabels(); });
$('#t-half').addEventListener('click',e=>{ state.half=!state.half; e.currentTarget.setAttribute('aria-pressed',state.half); clip.constant = state.half ? 1.15 : 100; renderer.shadowMap.needsUpdate = true; });
['overview','top','walk'].forEach(m=>$('#m-'+m).addEventListener('click',()=>setMode(m)));

/* ---------- Camera ---------- */
let tween = null;
function flyTo(pos,target,instant){
  if(instant || reduce){ camera.position.copy(pos); controls.target.copy(target); controls.update(); tween=null; return; }
  tween = {p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:target, start:performance.now(), dur:750};
}
function overviewPose(){
  const d = 17*Math.max(1, 0.95/camera.aspect);
  const dir = new THREE.Vector3(0.38,0.78,0.62).normalize().multiplyScalar(d);
  return [CENTER.clone().add(dir), CENTER.clone()];
}
function topPose(){
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const h = Math.max(7.2/(t*camera.aspect), 7.4/t)*1.06;
  return [new THREE.Vector3(CENTER.x, h, CENTER.z+0.01), CENTER.clone()];
}
function roomCenter(rm){ const [x0,z0,x1,z1]=rm.r; return new THREE.Vector3((x0+x1)/200,0,(z0+z1)/200); }

// Walk state
const walker = {yaw:-Math.PI/2, pitch:-0.05, pos:new THREE.Vector3()};
const EYE = 1.55;
function placeWalker(rm, yaw){
  const c = roomCenter(rm);
  walker.pos.set(c.x, EYE, c.z);
  if(yaw!==undefined) walker.yaw = yaw;
  else {
    const dx = CENTER.x-c.x, dz = CENTER.z-c.z;
    walker.yaw = Math.hypot(dx,dz)<0.6 ? 0 : Math.atan2(-dx,-dz);
  }
  walker.pitch = -0.05;
}

function setMode(m){
  state.mode = m;
  ['overview','top','walk'].forEach(k=>$('#m-'+k).setAttribute('aria-pressed', k===m));
  $('#pad').hidden = m!=='walk';
  $('#hint').textContent = HINTS[m];
  syncLabels();
  if(m==='walk'){
    controls.enabled = false; tween = null;
    camera.fov = 70; camera.updateProjectionMatrix();
    const rm = ROOMS.find(r=>r.id===state.room) || ROOMS[0];
    placeWalker(rm, rm.id==='foyer' ? -Math.PI/2 : undefined);
    markChip(rm.id); state.room = rm.id;
  } else {
    controls.enabled = true;
    camera.fov = 45; camera.updateProjectionMatrix();
    camera.rotation.order = 'XYZ';
    const [p,t] = m==='top' ? topPose() : overviewPose();
    flyTo(p,t);
    markChip(null); state.room = null;
  }
}

function goRoom(rm){
  state.room = rm.id; markChip(rm.id);
  if(state.mode==='walk'){ placeWalker(rm); return; }
  const c = roomCenter(rm);
  if(state.mode==='top'){ flyTo(new THREE.Vector3(c.x, 8.5, c.z+0.01), c); return; }
  flyTo(c.clone().add(new THREE.Vector3(2.6,5.2,4.4)), c);
}

/* ---------- Walk input ---------- */
const keys = {}; let padMove = 0, padTurn = 0;
addEventListener('keydown',e=>{ if(state.mode!=='walk') return; const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=true; e.preventDefault(); }});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; padMove=padTurn=0; });

$('#pad').querySelectorAll('button').forEach(b=>{
  const act = b.dataset.act;
  const on = e=>{ e.preventDefault(); try{b.setPointerCapture(e.pointerId);}catch(_){} if(act==='fwd')padMove=1; if(act==='back')padMove=-1; if(act==='left')padTurn=1; if(act==='right')padTurn=-1; };
  const off = ()=>{ if(act==='fwd'||act==='back')padMove=0; else padTurn=0; };
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

let look = null;
canvas.addEventListener('pointerdown',e=>{ if(state.mode!=='walk') return; look={x:e.clientX,y:e.clientY,id:e.pointerId}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointermove',e=>{
  if(!look || e.pointerId!==look.id) return;
  walker.yaw   += (e.clientX-look.x)*0.0045;
  walker.pitch += (e.clientY-look.y)*0.0045;
  walker.pitch = Math.max(-1.2, Math.min(1.2, walker.pitch));
  look.x=e.clientX; look.y=e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>look=null));

function updateWalk(dt){
  const f = ((keys.w||keys.arrowup)?1:0) - ((keys.s||keys.arrowdown)?1:0) + padMove;
  const st = (keys.d?1:0) - (keys.a?1:0);
  const tr = (keys.arrowleft?1:0) - (keys.arrowright?1:0) + padTurn;
  walker.yaw += tr*1.5*dt;
  const fx = -Math.sin(walker.yaw), fz = -Math.cos(walker.yaw);
  const sp = 1.7*dt;
  walker.pos.x += (fx*f + (-fz)*st)*sp;
  walker.pos.z += (fz*f + (fx)*st)*sp;
  walker.pos.x = Math.max(-5.6, Math.min(8.2, walker.pos.x));
  walker.pos.z = Math.max(-2.5, Math.min(11.7, walker.pos.z));
  camera.position.copy(walker.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.set(walker.pitch, walker.yaw, 0);
}

/* ---------- Loop ---------- */
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/Math.max(1,h); camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();
setMode('overview');
{ const [p,t]=overviewPose(); flyTo(p,t,true); }

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(state.mode==='walk') updateWalk(dt);
  else {
    if(tween){
      let k = Math.min(1,(now-tween.start)/tween.dur); const e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
      camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e);
      if(k>=1) tween=null;
    }
    controls.update();
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

</body></html>
